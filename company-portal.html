<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Company Portal - CampusReady</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <div class="navbar">
      <h1 class="logo">CampusReady</h1>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="#">Profile</a>
        <a href="#" onclick="logout()">Logout</a>
      </div>
    </div>

    <div class="dashboard-header">
      <h2>Company Portal 🏢</h2>
      <p>Browse and shortlist placement ready students.</p>
    </div>

    <div class="filter-section">
      <input type="text" id="searchName" placeholder="Search by name..." class="input-field" style="width:220px">
      <select id="filterBranch" class="input-field" style="width:180px">
        <option value="">All Branches</option>
        <option value="CSE">CSE</option>
        <option value="ECE">ECE</option>
        <option value="EEE">EEE</option>
        <option value="MECH">MECH</option>
      </select>
      <select id="filterYear" class="input-field" style="width:180px">
        <option value="">All Years</option>
        <option value="1st Year">1st Year</option>
        <option value="2nd Year">2nd Year</option>
        <option value="3rd Year">3rd Year</option>
        <option value="4th Year">4th Year</option>
      </select>
      <button class="btn" style="width:120px" onclick="loadStudents()">Search</button>
    </div>

    <!-- Student List -->
    <div class="student-list" id="studentList">
      <p style="text-align:center; color:#666;">Loading students...</p>
    </div>

    <!-- Shortlisted Students -->
    <div class="skills-section" style="margin: 0 40px 40px;">
      <h2>Shortlisted Students 📋</h2>
      <div id="shortlistedList" style="padding: 20px;">
        <p style="color:#666666; text-align:center;">Loading...</p>
      </div>
    </div>

    <script src="api.js"></script>
    <script>
      let shortlistedIds = new Set();
      let studentsById   = {};

      window.onload = async function () {
        if (!requireRole("company", "company-login.html")) return;
        await loadShortlisted();
        await loadStudents();
      };

      async function loadStudents() {
        const name   = document.getElementById("searchName").value.trim();
        const branch = document.getElementById("filterBranch").value;
        const year   = document.getElementById("filterYear").value;

        try {
          const res = await StudentAPI.all({ name, branch, year });
          if (!res) return;
          renderStudents(res.students);
        } catch (err) {
          const p = document.createElement("p");
          p.style.cssText = "color:red; text-align:center;";
          p.textContent = err.message;
          document.getElementById("studentList").replaceChildren(p);
        }
      }

      function renderStudents(students) {
        const container = document.getElementById("studentList");

        if (!students || students.length === 0) {
          container.innerHTML = '<p style="text-align:center; color:#666;">No students found.</p>';
          return;
        }

        studentsById = {};
        let html = "";
        students.forEach(s => {
          studentsById[s.id] = s;
          const done = shortlistedIds.has(s.id);
          html += `
            <div class="student-card">
              <div class="student-info">
                <h3>${esc(s.name)}</h3>
                <p>${esc(s.branch)} • ${esc(s.year)} • CGPA: ${esc(s.cgpa)}</p>
                <p>Aptitude: ${esc(s.aptitude_score)}% | Coding: ${esc(s.coding_score)}% | Communication: ${esc(s.communication_score)}% | Reasoning: ${esc(s.reasoning_score)}%</p>
              </div>
              <div class="student-score">
                <div class="score-badge">${esc(s.readiness_score)}%</div>
                <p>Readiness Score</p>
                <a href="#" class="btn-small" id="btn-${Number(s.id)}" data-id="${Number(s.id)}"
                   style="${done ? "background-color:#1D9E75; pointer-events:none;" : ""}">${done ? "Shortlisted ✓" : "Shortlist"}</a>
              </div>
            </div>
          `;
        });
        container.innerHTML = html;

        container.querySelectorAll("a.btn-small").forEach(btn => {
          btn.addEventListener("click", (e) => {
            e.preventDefault();
            shortlistStudent(Number(btn.dataset.id), btn);
          });
        });
      }

      async function shortlistStudent(studentId, btnEl) {
        const name = studentsById[studentId] ? studentsById[studentId].name : "Student";
        try {
          const res = await CompanyAPI.shortlist(studentId);
          if (!res) return;
          btnEl.innerText = "Shortlisted ✓";
          btnEl.style.backgroundColor = "#1D9E75";
          btnEl.style.pointerEvents   = "none";
          await loadShortlisted();
          alert(`${name} has been shortlisted!`);
        } catch (err) {
          alert(err.message);
        }
      }

      async function removeShortlist(studentId) {
        try {
          const res = await CompanyAPI.removeShortlist(studentId);
          if (!res) return;
          await loadShortlisted();
          await loadStudents();
        } catch (err) {
          alert(err.message);
        }
      }

      async function loadShortlisted() {
        try {
          const res = await CompanyAPI.shortlisted();
          if (!res) return;
          const container = document.getElementById("shortlistedList");
          shortlistedIds = new Set((res.shortlisted || []).map(s => s.id));

          if (!res.shortlisted || res.shortlisted.length === 0) {
            container.innerHTML = '<p style="color:#666666; text-align:center;">No students shortlisted yet.</p>';
            return;
          }

          let html = "";
          res.shortlisted.forEach(s => {
            html += `
              <div class="student-card" style="margin-bottom:12px">
                <div class="student-info">
                  <h3>${esc(s.name)}</h3>
                  <p>${esc(s.branch)} • CGPA: ${esc(s.cgpa)}</p>
                </div>
                <div class="student-score">
                  <div class="score-badge">${esc(s.readiness_score)}%</div>
                  <p>Readiness Score</p>
                  <span style="color:#1D9E75; font-weight:bold;">✓ Shortlisted</span>
                  <a href="#" class="btn-small btn-remove" data-id="${Number(s.id)}"
                     style="background-color:#e74c3c; margin-top:6px; display:inline-block;">Remove</a>
                </div>
              </div>
            `;
          });
          container.innerHTML = html;

          container.querySelectorAll("a.btn-remove").forEach(btn => {
            btn.addEventListener("click", (e) => {
              e.preventDefault();
              removeShortlist(Number(btn.dataset.id));
            });
          });
        } catch (err) {
          console.error(err);
        }
      }

      function logout() {
        clearToken();
        window.location.href = "index.html";
      }
    </script>

  </body>
</html>
